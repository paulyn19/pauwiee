<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Password Generator</title><link rel="stylesheet" href="style.css"></head><body><main><section class="card"><p class="pill">MINI PROJECT 05</p><h1>Password Generator</h1><p>Create a strong random password.</p><label>Password length: <strong id="lengthLabel">16</strong></label><input id="length" type="range" min="8" max="40" value="16"><div class="grid"><label><input id="lower" type="checkbox" checked> Lowercase</label><label><input id="upper" type="checkbox" checked> Uppercase</label><label><input id="numbers" type="checkbox" checked> Numbers</label><label><input id="symbols" type="checkbox" checked> Symbols</label></div><button id="generate">Generate password</button><label>Generated password</label><div class="row"><input id="result" readonly placeholder="Your password appears here"><button id="copy" class="secondary">Copy</button></div><p id="message" class="muted"></p></section></main><script src="script.js"></script></body></html>
