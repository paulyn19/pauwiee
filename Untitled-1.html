<!DOCTYPE html>
<html>
<head>
  <title>Color Changing Background</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      transition: background-color 1s ease;
    }
  </style>
</head>
<body>
  <script>
    const colors = ["#FF5733", "#33FF57", "#3357FF", "#F1C40F", "#9B59B6"];
    let i = 0;

    setInterval(() => {
      document.body.style.backgroundColor = colors[i];
      i = (i + 1) % colors.length;
    }, 1000);
  </script>
</body>
</html>
